# HTTP bootstrap configuration. After Certbot has issued the certificate, use
# nginx-forextestlab-tls.conf so later deployments preserve the HTTPS listener.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name forextestlab.com www.forextestlab.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Supabase OAuth sets the authenticated session across multiple
        # cookies. Their combined Set-Cookie response headers can exceed
        # Nginx's small default proxy header buffer and otherwise produce a
        # 502 "upstream sent too big header" on /auth/callback.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
